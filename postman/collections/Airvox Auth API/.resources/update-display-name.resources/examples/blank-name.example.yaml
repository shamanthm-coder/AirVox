$kind: http-example
name: Blank name
order: 1000
request:
  method: PATCH
  url: '{{base_url}}/v1/me'
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "invalid_name",
        "message": "Use a name of 1 to 40 characters."
      }
